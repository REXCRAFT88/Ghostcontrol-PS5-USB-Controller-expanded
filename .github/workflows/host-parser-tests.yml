name: Host parser tests

on:
  push:
    branches:
      - "feature/sony-bluetooth-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sony-parsers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run wired Sony parser tests
        run: sh tests/run_sony_tests.sh

      - name: Run Bluetooth Sony parser tests
        run: sh tests/run_sony_bt_tests.sh

      - name: Run Bluetooth transport tests
        run: sh tests/run_sony_bt_transport_tests.sh

      - name: Run Bluetooth radio descriptor tests
        run: sh tests/run_sony_bt_probe_tests.sh

      - name: Compile Bluetooth probe entry point
        run: sh tests/run_sony_bt_probe_build_test.sh

      - name: Compile Bluetooth probe Prospero path
        run: sh tests/run_sony_bt_probe_prospero_build_test.sh

      - name: Run Bluetooth HCI stream tests
        run: sh tests/run_sony_bt_stream_tests.sh

      - name: Compile passive Bluetooth observer PS5 path
        run: sh tests/run_sony_bt_passive_prospero_build_test.sh
